name: desktop-build

# 三平台桌面安装包构建。产物只作为 artifact 上传，不自动创建 Release：
# 目前 macOS 未做 Developer ID 签名与公证，Windows 未买代码签名证书，
# 自动发 Release 会把"能下载但会被系统拦"的包直接推给用户。
#
# 触发：手动，或推送 desktop-v* 标签（例如 desktop-v0.1.0）。

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 上游 go.mod 声明的 Go 版本高于 runner 自带版本，必须允许自动下载工具链
  GOTOOLCHAIN: auto
  GOSUMDB: sum.golang.org
  # AppImage 的 linuxdeploy 在无 FUSE 的容器里需要解包运行
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            triple: aarch64-apple-darwin
            make_target: host
            bundles: dmg
          - name: linux-x64
            os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            make_target: linux_amd64
            bundles: appimage,deb
          - name: windows-x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            make_target: windows_amd64
            bundles: nsis

    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@v7
        with:
          # build-sidecar.sh 用 git describe / git log 生成版本信息，浅克隆会失败
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          # 直接读 go.mod 里声明的版本（1.26.0），避免 runner 自带版本过旧导致
          # GOTOOLCHAIN=auto 的下载链路成为隐藏依赖
          go-version-file: go.mod
          cache: false

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/shell/src-tauri

      - name: 安装 Zig（Linux / Windows 交叉编译 sqlite 需要 C 编译器）
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit2gtk-4.1 是 Tauri v2 的硬要求（Ubuntu 22.04 只有 4.0，所以固定用 24.04）
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2t64

      - name: 环境诊断
        shell: bash
        run: |
          echo "go:    $(go version 2>&1 || echo MISSING)"
          echo "make:  $(make --version 2>&1 | head -1 || echo MISSING)"
          echo "node:  $(node -v 2>&1 || echo MISSING)"
          echo "npm:   $(npm -v 2>&1 || echo MISSING)"
          echo "rustc: $(rustc -V 2>&1 || echo MISSING)"
          echo "cc:    $(which cc clang gcc zig 2>/dev/null | tr '\n' ' ' || echo MISSING)"

      - name: 构建 sidecar（上游 Go 二进制）
        shell: bash
        env:
          YARR_TRIPLE: ${{ matrix.triple }}
          YARR_MAKE_TARGET: ${{ matrix.make_target }}
        # 调用同一个脚本，保证本地与 CI 的构建参数完全一致：
        # 内部按需 npm ci + npm run build 生成 go:embed 资源，再调上游 makefile 的对应目标，
        # 最后按 target triple 命名成 Tauri externalBin 要求的文件名（Windows 带 .exe）。
        #
        # 失败时把最后 12 行输出成 ::error:: 注解：仓库无 token 时也能通过
        # check-runs/annotations API 读到原因（job 日志本身要 admin 权限）。
        run: |
          set -o pipefail
          if ./desktop/scripts/build-sidecar.sh 2>&1 | tee /tmp/sidecar-build.log; then
            exit 0
          fi
          echo "### sidecar 构建失败（最后 12 行）" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; tail -12 /tmp/sidecar-build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -12 /tmp/sidecar-build.log | sed 's/^/::error::/'
          exit 1

      - name: 解析版本号
        id: ver
        shell: bash
        # 用 tag 决定应用版本，避免 tauri.conf.json 里写死的 0.1.0 和 Release 对不上
        # （表现为 dmg/exe 文件名固定是 yarr_0.1.0_*）。
        run: |
          REF="${{ github.ref_name }}"
          V="${REF#desktop-v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            V="0.1.0"
            echo "::warning::无法从 $REF 解析出版本号，回退到 $V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "应用版本: $V"

      - name: 打包桌面应用
        shell: bash
        # --bundles 按平台覆盖 tauri.conf.json 里的 targets（那里的 app/dmg 只对 macOS 有效）。
        # --config 临时覆盖 version，让包内版本与 Release tag 一致。
        # 锁 @2 大版本，避免 CLI 跨大版本变更把流水线打挂。
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"

      - name: 校验产物
        shell: bash
        run: |
          set -e
          BIN="desktop/shell/src-tauri/binaries/yarr-${{ matrix.triple }}"
          [[ "${{ runner.os }}" == "Windows" ]] && BIN="$BIN.exe"
          test -f "$BIN" || { echo "::error::sidecar 缺失: $BIN"; exit 1; }
          echo "--- sidecar ---"
          ls -lh "$BIN"
          "$BIN" -version

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: yarr-desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/shell/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/shell/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/shell/src-tauri/target/release/bundle/deb/*.deb
            desktop/shell/src-tauri/target/release/bundle/nsis/*.exe

  # 只有推 desktop-v* 标签时才发 Release（手动 dispatch 只出 artifact，不发版）。
  # 是否标 pre-release 由 tag 后缀决定（见下面 prerelease 表达式）：
  # 稳定的 desktop-vX.Y.Z 走正式发布，才能被 GitHub 认定为 Latest release。
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总三平台安装包
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        # artifact 的内部结构取决于 upload-artifact 的「最小公共父目录」推断，
        # 不同平台的产物可能落在 dist/ 的子目录里，所以这里打全量清单而不是只看根目录。
        run: find dist -type f | sort

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: yarr desktop ${{ github.ref_name }}
          # 只有带 -rc / -beta / -alpha 后缀的 tag 才算 pre-release。
          # GitHub 的「Latest release」只认非 prerelease 的发布：全是 prerelease 时
          # 仓库首页侧边栏只会显示一个裸 tag，拿不到版本号和发布说明。
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          draft: false
          fail_on_unmatched_files: true
          body: |
            yarr 的非官方桌面版（Tauri 壳 + 上游 Go 二进制 sidecar，上游代码零改动）。
            上游基线 commit：`${{ github.sha }}`（[nkanaev/yarr](https://github.com/nkanaev/yarr)）。

            | 平台 | 文件 |
            | --- | --- |
            | macOS (Apple Silicon) | `.dmg` |
            | Windows x64 | NSIS `.exe` |
            | Linux x64 | `.AppImage` / `.deb` |

            > 这是正式发布的版本，但**未做代码签名/公证**，系统会拦一次，见下。

            ## 未签名提示（重要）

            这些包**没有代码签名和公证**，系统会报警，这是预期行为：

            - **macOS**：拖进「应用程序」后**右键 → 打开**；或执行
              `xattr -dr com.apple.quarantine /Applications/yarr.app`
            - **Windows**：SmartScreen 弹窗点「更多信息」→「仍要运行」
            - **Linux**：`chmod +x yarr*.AppImage && ./yarr*.AppImage`

            ## 它做了什么

            - Tauri 只做壳：窗口、托盘、单实例、外链走系统浏览器、崩溃自愈、退出回收
            - 后端是上游 yarr 原样编译的 sidecar，监听 `127.0.0.1` 随机端口
            - 数据目录：macOS `~/Library/Application Support/app.yarr.desktop/`，Windows `%APPDATA%\app.yarr.desktop\`
            - 唯一的上游补丁：WKWebView 缺失的 `prompt/confirm` 替代实现（见 `desktop/docs/upstream.md`）
          # 用递归匹配：跨平台 artifact 合并后可能出现 dist/<子目录>/xxx 的层级，
          # 早先用 dist/*.dmg 直接报「Pattern does not match any files」。
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
